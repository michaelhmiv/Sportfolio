openapi: 3.1.0
info:
  title: Sportfolio Internal API (Core Surface)
  version: 0.1.0
  description: >-
    Internal API contract snapshot for critical endpoints. This file is intended
    to be expanded as routes are modularized.
servers:
  - url: http://localhost:5000
paths:
  /api/health:
    get:
      summary: Service health
      responses:
        "200":
          description: Health payload
  /api/amm/{playerId}:
    get:
      summary: AMM pool state
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pool data
  /api/lp/positions:
    get:
      summary: User LP positions
      responses:
        "200":
          description: LP positions for authenticated user
  /api/holdings/stack-shares:
    post:
      summary: Stack regular shares into a stacked-share multiplier
      responses:
        "200":
          description: Stack-shares result
  /api/holdings/{playerId}/multiplier-state:
    get:
      summary: Read stacked-share multiplier state for one player holding
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Multiplier-state payload
