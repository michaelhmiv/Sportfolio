name: Temporary scout fractional schema patch

on:
  push:
    branches:
      - fix/scout-fractional-total-shares

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[scout-schema-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scout-fractional-total-shares
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch schema and decimal consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s) of {old!r}')
              p.write_text(text.replace(old, new, count))

          replace(
              'shared/schema.ts',
              'totalShares: integer("total_shares").notNull().default(0), // Total shares held by all users, updated on each trade',
              'totalShares: decimal("total_shares", { precision: 12, scale: 4 })\n      .notNull()\n      .default("0.0000"), // Total shares held by all users, including fractional shares',
          )
          replace('server/storage.scout-distribution.test.ts', 'sharesEarned: "30.00",', 'sharesEarned: "30.25",')
          replace('server/bot/trading-strategy.ts', '    totalShares: number;\n', '    totalShares: string;\n')
          replace('server/routes.ts', '        totalShares: player.totalShares || 0,', '        totalShares: Number(player.totalShares || 0),', 2)
          replace('client/src/components/market-mobile-home.tsx', '    totalShares: 0,', '    totalShares: "0.0000",')
          replace('client/src/components/market-mobile-pools-board.tsx', '    totalShares: 0,', '    totalShares: "0.0000",')
          PY
      - run: npx prettier --write shared/schema.ts server/storage.scout-distribution.test.ts server/bot/trading-strategy.ts server/routes.ts client/src/components/market-mobile-home.tsx client/src/components/market-mobile-pools-board.tsx server/player-total-shares-decimal.contract.test.ts
      - run: npm run check
      - run: npx vitest run server/storage.scout-distribution.test.ts server/player-total-shares-decimal.contract.test.ts
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/schema.ts server/storage.scout-distribution.test.ts server/bot/trading-strategy.ts server/routes.ts client/src/components/market-mobile-home.tsx client/src/components/market-mobile-pools-board.tsx server/player-total-shares-decimal.contract.test.ts
          git commit -m 'Align player totals with fractional shares [scout-schema-patched]'
          git push origin HEAD:fix/scout-fractional-total-shares
