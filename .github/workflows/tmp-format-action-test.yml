name: Temporary Action Review Test Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/chatgpt-ui-market-action-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier server/mcp/plugin/ui/action-surface.test.ts --write
      - name: Commit formatted test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mcp/plugin/ui/action-surface.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format action review coverage test"
          git push origin HEAD:${{ github.head_ref }}
