name: Plugin Readiness

on:
  push:
    branches:
      - "plugin/**"
  pull_request:
    paths:
      - "server/mcp/plugin/**"
      - "server/auth/plugin-**"
      - "server/routes/plugin-**"
      - "client/src/pages/oauth-consent.tsx"
      - "client/src/pages/connected-apps.tsx"
      - "client/src/pages/plugin-**"
      - "client/oauth/**"
      - "client/plugin/**"
      - "client/plugin-support/**"
      - "plugins/sportfolio/**"
      - ".agents/plugins/marketplace.json"
      - "scripts/plugin-**"
      - "docs/plugin/**"
      - "client/src/pages/privacy.tsx"
      - "client/src/pages/terms.tsx"
      - "tsconfig.plugin.json"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plugin-readiness.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

concurrency:
  group: plugin-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_plugin_ci

jobs:
  dependency-autofix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'plugin/14-release-candidate' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plugin/14-release-candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking npm audit fixes
        run: npm audit fix || true
      - name: Require zero critical production advisories
        run: npm audit --omit=dev --audit-level=critical
      - name: Install locked dependency tree
        run: npm ci
      - name: Plugin TypeScript certification
        run: npx tsc -p tsconfig.plugin.json --noEmit
      - name: Production build
        run: npm run build
      - name: Plugin unit tests
        run: >-
          npx vitest run
          server/mcp/plugin/capability-policy.test.ts
          server/mcp/plugin/adapters.test.ts
          server/mcp/plugin/runtime-guard.test.ts
          server/auth/plugin-token-verifier.test.ts
          scripts/plugin-oauth-discovery-check.test.ts
          scripts/plugin-oauth-token-inspect.test.ts
      - name: Existing and marketplace MCP certification
        run: |
          npm run mcp:audit
          npm run mcp:smoke
          npx tsx scripts/plugin-smoke.ts
      - name: Commit verified dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No safe dependency changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply verified production dependency updates"
          git push origin HEAD:plugin/14-release-candidate

  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Plugin TypeScript certification
        run: npx tsc -p tsconfig.plugin.json --noEmit
      - name: Repository baseline typecheck
        continue-on-error: true
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Plugin unit tests
        run: >-
          npx vitest run
          server/mcp/plugin/capability-policy.test.ts
          server/mcp/plugin/adapters.test.ts
          server/mcp/plugin/runtime-guard.test.ts
          server/auth/plugin-token-verifier.test.ts
          scripts/plugin-oauth-discovery-check.test.ts
          scripts/plugin-oauth-token-inspect.test.ts
      - name: Marketplace audit
        run: npx tsx scripts/plugin-audit.ts
      - name: Catalog freeze
        run: npx tsx scripts/plugin-catalog-check.ts
      - name: Package structure
        run: npx tsx scripts/plugin-package-check.ts
      - name: Privacy scan
        run: npx tsx scripts/plugin-privacy-check.ts
      - name: Submission kit
        run: npx tsx scripts/plugin-submission-check.ts
      - name: External release gate report
        run: npx tsx scripts/plugin-release-gate.ts

  protocol-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Existing MCP audit
        run: npm run mcp:audit
      - name: Existing MCP smoke
        run: npm run mcp:smoke
      - name: Marketplace MCP smoke
        run: npx tsx scripts/plugin-smoke.ts

  production-dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit production dependencies for critical advisories
        run: npm audit --omit=dev --audit-level=critical

  live-oauth-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLUGIN_OAUTH_ISSUER: https://xolfyrbtkmwgllrazcfh.supabase.co/auth/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Supabase OAuth discovery and JWKS
        run: npx tsx scripts/plugin-oauth-discovery-check.ts
