name: Plugin Readiness

on:
  push:
    branches:
      - "plugin/**"
      - "feat/chatgpt-plugin-ui"
  pull_request:
    paths:
      - "server/mcp/plugin/**"
      - "server/mcp/public-**"
      - "server/auth/**"
      - "server/routes/plugin-**"
      - "server/routes/mcp.ts"
      - "server/jobs/**"
      - "server/worker.ts"
      - "client/src/plugin-ui/**"
      - "client/src/pages/oauth-consent.tsx"
      - "client/src/pages/connected-apps.tsx"
      - "client/src/pages/plugin-**"
      - "client/oauth/**"
      - "client/plugin/**"
      - "client/plugin-support/**"
      - "plugins/sportfolio/**"
      - ".agents/plugins/marketplace.json"
      - "config/public-capability-*.json"
      - "scripts/public-capability-governance.ts"
      - "scripts/plugin-**"
      - "scripts/build-plugin-ui.mjs"
      - "docs/plugin/**"
      - "docs/operations/public-capability-governance.md"
      - "client/src/pages/privacy.tsx"
      - "client/src/pages/terms.tsx"
      - "chatgpt-app-submission.json"
      - "tsconfig.plugin.json"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plugin-readiness.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

concurrency:
  group: plugin-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_plugin_ci

jobs:
  implement-chatgpt-ui-hardening:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.head_ref == 'factory/task-chatgpt-ui-contract-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Implement hardening task with Codex CLI
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEX_API_KEY"
          codex --version
          codex exec \
            --sandbox workspace-write \
            --ephemeral \
            --ignore-user-config \
            --disable plugins \
            - < .factory/tasks/chatgpt-ui-contract-hardening.md

      - name: Restore trusted workflow and commit source changes
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- server client scripts package.json package-lock.json tsconfig.plugin.json vite.config.ts)" ]; then
            echo "Codex produced no implementation changes in expected source/test paths." >&2
            exit 1
          fi

          git fetch origin main
          git checkout origin/main -- .github/workflows/plugin-readiness.yml
          rm -f .github/workflows/direct-codex-chatgpt-hardening.yml
          rm -f .factory/tasks/chatgpt-ui-contract-hardening.md
          rm -f .factory-implementation-report.md
          rmdir .factory/tasks 2>/dev/null || true
          rmdir .factory 2>/dev/null || true

          if git diff --name-only | grep -E '^\.github/workflows/' | grep -v '^\.github/workflows/(plugin-readiness|direct-codex-chatgpt-hardening)\.yml$'; then
            echo "Implementation modified unrelated trusted workflow files." >&2
            exit 1
          fi

          git config user.name "openai-codex[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(plugin-ui): harden ChatGPT MCP app contracts"
          git push origin HEAD:${{ github.head_ref }}

  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Plugin TypeScript certification
        run: npx tsc -p tsconfig.plugin.json --noEmit
      - name: Repository typecheck
        run: npx tsc
      - name: Production build
        run: |
          npm run build
          npx esbuild server/worker.ts --platform=node --packages=external --bundle --format=esm --outfile=dist/worker.js
      - name: Public capability governance
        run: npm run governance:capabilities
      - name: Plugin unit tests
        run: >-
          npx vitest run
          server/mcp/plugin/capability-policy.test.ts
          server/mcp/plugin/adapters.test.ts
          server/mcp/plugin/runtime-guard.test.ts
          server/mcp/plugin/ui/surface.test.ts
          server/auth/plugin-token-verifier.test.ts
          scripts/plugin-oauth-discovery-check.test.ts
          scripts/plugin-oauth-token-inspect.test.ts
      - name: Marketplace audit
        run: npx tsx scripts/plugin-audit.ts
      - name: Plugin UI audit
        run: npm run plugin:ui:audit
      - name: Catalog freeze
        run: npx tsx scripts/plugin-catalog-check.ts
      - name: Package structure
        run: npx tsx scripts/plugin-package-check.ts
      - name: Privacy scan
        run: npx tsx scripts/plugin-privacy-check.ts
      - name: Submission kit
        run: npx tsx scripts/plugin-submission-check.ts
      - name: Verify OpenAI submission import
        run: npx tsx scripts/generate-chatgpt-app-submission.ts --check
      - name: External release gate report
        run: npx tsx scripts/plugin-release-gate.ts

  protocol-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Existing MCP audit
        run: npm run mcp:audit
      - name: Existing MCP smoke
        run: npm run mcp:smoke
      - name: Marketplace MCP smoke
        run: npx tsx scripts/plugin-smoke.ts

  production-dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit production dependencies for critical advisories
        run: npm audit --omit=dev --audit-level=critical

  live-oauth-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLUGIN_OAUTH_ISSUER: ${{ github.event_name == 'pull_request' && 'https://beta.sportfolio.market/api/auth/better' || 'https://www.sportfolio.market/api/auth/better' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Better Auth OAuth discovery and JWKS
        run: npx tsx scripts/plugin-oauth-discovery-check.ts
