name: Analytics Coverage Diagnostic

on:
  push:
    branches:
      - codex/analytics-market-terminal

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/analytics-market-terminal
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture coverage result
        run: |
          set +e
          npm run test:coverage > coverage-diagnostic.log 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            echo "--- tail ---"
            tail -n 240 coverage-diagnostic.log
          } > ci-analytics-coverage.txt
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-analytics-coverage.txt
          git commit -m "ci: capture analytics coverage diagnostic"
          git push origin HEAD:codex/analytics-market-terminal
