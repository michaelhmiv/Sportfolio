name: Analytics Notional Fix

on:
  push:
    branches:
      - codex/analytics-market-terminal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/analytics-market-terminal
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace nonexistent total_cost references
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/analytics/market-research.ts')
          text = path.read_text()
          text = text.replace('t.total_cost::numeric', '(t.price::numeric * t.quantity::numeric)')
          text = text.replace('t.total_cost::float8', '(t.price::numeric * t.quantity::numeric)::float8')
          path.write_text(text)
          PY
          npx prettier --write server/analytics/market-research.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/analytics/market-research.ts
          git commit -m "fix: derive analytics notional from trade price and quantity"
          git push origin HEAD:codex/analytics-market-terminal
