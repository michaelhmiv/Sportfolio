name: One-Shot Apply Reviewed Retired Surface Refactor

on:
  push:
    branches:
      - ops/apply-retired-surface-refactor-v5
    paths:
      - .refactor-payload/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: 0cf2943aa577924e4ff772b7e52e927bd912b7a7
      EXPECTED_PAYLOAD_SHA256: 7094690f9d4463363cddaad79fe4e582991412ffb3afe9111dfcfbd80bc3b3bc
      EXPECTED_DIFF_SHA256: b45999c3a51955c31cd9cb38b379686b9add003da7a9e9d0add9ded0ab8063b5
      TARGET_BRANCH: refactor/remove-retired-agent-sms-curate-mlb
      DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_refactor_ci
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v5
        with:
          ref: ops/apply-retired-surface-refactor-v5
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and verify reviewed delta
        shell: bash
        run: |
          set -euo pipefail
          cat .refactor-payload/part-*.b64 > /tmp/refactor-delta.b64
          base64 --decode /tmp/refactor-delta.b64 > /tmp/refactor-delta.json.xz
          echo "${EXPECTED_PAYLOAD_SHA256}  /tmp/refactor-delta.json.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/refactor-delta.json.xz > /tmp/refactor-delta.json

      - name: Verify validated main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          ACTUAL_MAIN_SHA="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "Refusing to apply: main moved from validated commit $EXPECTED_MAIN_SHA to $ACTUAL_MAIN_SHA" >&2
            exit 1
          }

      - name: Apply exact reviewed tree changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" origin/main
          python3 - <<'PY'
          import base64
          import json
          import pathlib
          import shutil

          root = pathlib.Path.cwd()
          delta = json.loads(pathlib.Path('/tmp/refactor-delta.json').read_text(encoding='utf-8'))
          expected_base = '0cf2943aa577924e4ff772b7e52e927bd912b7a7'
          if delta.get('base') != expected_base:
              raise SystemExit(f"delta base mismatch: {delta.get('base')} != {expected_base}")

          for rel in delta['delete']:
              target = root / rel
              if target.is_dir() and not target.is_symlink():
                  shutil.rmtree(target)
              elif target.exists() or target.is_symlink():
                  target.unlink()

          for rel, payload in delta['add'].items():
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              if 'text' in payload:
                  target.write_text(payload['text'], encoding='utf-8', newline='')
              else:
                  target.write_bytes(base64.b64decode(payload['b64']))

          for rel, hunks in delta['modify'].items():
              target = root / rel
              lines = target.read_text(encoding='utf-8').splitlines(keepends=True)
              for start, count, replacement in reversed(hunks):
                  lines[start:start + count] = replacement.splitlines(keepends=True)
              target.write_text(''.join(lines), encoding='utf-8', newline='')
          PY
          git add -A
          git diff --cached --check
          ACTUAL_DIFF_SHA256="$(git diff --cached --binary | sha256sum | cut -d' ' -f1)"
          test "$ACTUAL_DIFF_SHA256" = "$EXPECTED_DIFF_SHA256" || {
            echo "Refusing to push: reconstructed diff checksum mismatch" >&2
            echo "expected=$EXPECTED_DIFF_SHA256 actual=$ACTUAL_DIFF_SHA256" >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate applied refactor
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run format:check
          npm run check
          npm run lint
          npm run retired-surfaces:audit
          npm run public-tools:audit
          npm run governance:capabilities
          npm run build

      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sportfolio-refactor[bot]"
          git config user.email "34044957+michaelhmiv@users.noreply.github.com"
          git commit -m "refactor(mcp): remove retired product surfaces and curate MLB tools"
          git push --force-with-lease origin "$TARGET_BRANCH"
