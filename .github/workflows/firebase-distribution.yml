name: Firebase App Distribution

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:client

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug

      - name: Validate Firebase secrets
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::Missing required secret FIREBASE_APP_ID"
            exit 1
          fi

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing required secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Configure Firebase credentials (ADC)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Upload to Firebase App Distribution (CLI)
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_DISTRIBUTION_TESTERS }}
          FIREBASE_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_DISTRIBUTION_GROUPS }}
        run: |
          RELEASE_NOTES=$(cat <<EOF
          Build from commit ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Triggered by: ${GITHUB_ACTOR}
          EOF
          )

          DISTRIBUTION_LOG="$RUNNER_TEMP/firebase-distribution.log"
          set -euo pipefail

          if [ -n "$FIREBASE_DISTRIBUTION_TESTERS" ]; then
            firebase appdistribution:distribute mobile/android/app/build/outputs/apk/debug/app-debug.apk \
              --app "$FIREBASE_APP_ID" \
              --testers "$FIREBASE_DISTRIBUTION_TESTERS" \
              --release-notes "$RELEASE_NOTES" | tee "$DISTRIBUTION_LOG"
          elif [ -n "$FIREBASE_DISTRIBUTION_GROUPS" ]; then
            firebase appdistribution:distribute mobile/android/app/build/outputs/apk/debug/app-debug.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_DISTRIBUTION_GROUPS" \
              --release-notes "$RELEASE_NOTES" | tee "$DISTRIBUTION_LOG"
          else
            firebase appdistribution:distribute mobile/android/app/build/outputs/apk/debug/app-debug.apk \
              --app "$FIREBASE_APP_ID" \
              --release-notes "$RELEASE_NOTES" | tee "$DISTRIBUTION_LOG"
          fi
