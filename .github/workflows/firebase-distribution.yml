name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional Firebase release name (defaults to commit SHA)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:client

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default package list includes the legacy "tools"
          # package, which can pull emulator downloads this release build does
          # not need. Keep this setup narrow so Firebase distribution is not
          # blocked by emulator archive/download issues.
          packages: platform-tools

      - name: Validate Firebase + signing secrets
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required=(
            FIREBASE_APP_ID
            FIREBASE_SERVICE_ACCOUNT
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret ${name}"
              exit 1
            fi
          done

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$(mktemp "${RUNNER_TEMP}/android-release-keystore-XXXXXX.jks")"
          chmod 600 "$KEYSTORE_PATH"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded Android keystore is empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Compute release metadata
        env:
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          # Reserve 200000-299999 for Play internal builds and start Firebase at
          # 300000 to leave 100000 versionCode slots before the ranges overlap.
          # This keeps Firebase iteration builds installable over Play internal
          # builds without manual downgrades while preserving ample headroom for
          # the workflow's per-file run counter. If this workflow ever nears
          # 100000 runs, increase the reserved range here and in
          # .github/workflows/play-internal-testing.yml.
          VERSION_CODE_BASE=300000
          VERSION_CODE=$((VERSION_CODE_BASE + ${GITHUB_RUN_NUMBER}))
          echo "MOBILE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          if [ -n "$INPUT_RELEASE_NAME" ]; then
            SANITIZED_RELEASE_NAME="$(
              printf '%s' "$INPUT_RELEASE_NAME" \
                | sed 's/[\r\n]/-/g' \
                | tr -cd '[:alnum:]_-' \
                | cut -c1-50
            )"
            if [ -z "$SANITIZED_RELEASE_NAME" ] || ! printf '%s' "$SANITIZED_RELEASE_NAME" | grep -q '[[:alnum:]]'; then
              echo "::error::release_name must contain at least one alphanumeric character after sanitization."
              exit 1
            fi
            echo "FIREBASE_RELEASE_NAME=$SANITIZED_RELEASE_NAME" >> "$GITHUB_ENV"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "FIREBASE_RELEASE_NAME=firebase-${SHORT_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MOBILE_VERSION_CODE: ${{ env.MOBILE_VERSION_CODE }}
          MOBILE_VERSION_NAME: ${{ env.FIREBASE_RELEASE_NAME }}
        # The Node wrapper calls the checked-in Gradle wrapper from the repo root
        # so CI can reuse the same command shape as local scripts while passing
        # these signing env vars into mobile/android/app/build.gradle.
        run: node scripts/run-gradle-wrapper.mjs assembleRelease

      - name: Configure Firebase credentials (ADC)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Upload to Firebase App Distribution (CLI)
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_DISTRIBUTION_TESTERS }}
          FIREBASE_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_DISTRIBUTION_GROUPS }}
          FIREBASE_RELEASE_NAME: ${{ env.FIREBASE_RELEASE_NAME }}
          MOBILE_VERSION_CODE: ${{ env.MOBILE_VERSION_CODE }}
        run: |
          RELEASE_NOTES=$(cat <<EOF
          Build from commit ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Triggered by: ${GITHUB_ACTOR}
          Release: ${FIREBASE_RELEASE_NAME}
          Version code: ${MOBILE_VERSION_CODE}
          EOF
          )

          DISTRIBUTION_LOG="$RUNNER_TEMP/firebase-distribution.log"
          set -euo pipefail

          NORMALIZED_TESTERS="$(
            printf '%s\n' "${FIREBASE_DISTRIBUTION_TESTERS:-}" \
              | tr ',;' '\n' \
              | tr -d '\r' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | awk 'NF' \
              | awk '!seen[tolower($0)]++' \
              | paste -sd, -
          )"

          NORMALIZED_GROUPS="$(
            printf '%s\n' "${FIREBASE_DISTRIBUTION_GROUPS:-}" \
              | tr ',;' '\n' \
              | tr -d '\r' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | awk 'NF' \
              | awk '!seen[tolower($0)]++' \
              | paste -sd, -
          )"

          DISTRIBUTE_ARGS=(
            mobile/android/app/build/outputs/apk/release/app-release.apk
            --app "$FIREBASE_APP_ID"
            --release-notes "$RELEASE_NOTES"
          )

          if [ -n "$NORMALIZED_TESTERS" ]; then
            echo "Firebase tester recipients are configured."
            DISTRIBUTE_ARGS+=(--testers "$NORMALIZED_TESTERS")
          fi

          if [ -n "$NORMALIZED_GROUPS" ]; then
            echo "Firebase distribution groups are configured."
            DISTRIBUTE_ARGS+=(--groups "$NORMALIZED_GROUPS")
          fi

          if ! firebase appdistribution:distribute "${DISTRIBUTE_ARGS[@]}" > "$DISTRIBUTION_LOG" 2>&1; then
            echo "::error::Firebase distribution failed. Sanitized CLI output follows."
            sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[redacted-email]/g' "$DISTRIBUTION_LOG"
            exit 1
          fi

          echo "Firebase App Distribution upload completed."

      - name: Remove temporary signing and Firebase files
        if: ${{ always() }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          for sensitive_file in \
            "${ANDROID_KEYSTORE_PATH:-}" \
            "${GOOGLE_APPLICATION_CREDENTIALS:-}" \
            "${RUNNER_TEMP}/firebase-distribution.log"; do
            if [ -n "$sensitive_file" ] && [ -f "$sensitive_file" ]; then
              if command -v shred >/dev/null 2>&1; then
                shred -uz -- "$sensitive_file"
              else
                rm -- "$sensitive_file"
              fi
            fi
          done
