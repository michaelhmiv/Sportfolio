name: Firebase App Distribution

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    env:
      # Always include the core internal tester so new builds do not require manual email entry.
      DEFAULT_FIREBASE_DISTRIBUTION_TESTERS: michaelhmiv@gmail.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:client

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug

      - name: Validate Firebase secrets
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::Missing required secret FIREBASE_APP_ID"
            exit 1
          fi

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing required secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Configure Firebase credentials (ADC)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Upload to Firebase App Distribution (CLI)
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_DISTRIBUTION_TESTERS }}
          FIREBASE_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_DISTRIBUTION_GROUPS }}
          DEFAULT_FIREBASE_DISTRIBUTION_TESTERS: ${{ env.DEFAULT_FIREBASE_DISTRIBUTION_TESTERS }}
        run: |
          RELEASE_NOTES=$(cat <<EOF
          Build from commit ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Triggered by: ${GITHUB_ACTOR}
          EOF
          )

          DISTRIBUTION_LOG="$RUNNER_TEMP/firebase-distribution.log"
          set -euo pipefail

          RAW_TESTERS="$DEFAULT_FIREBASE_DISTRIBUTION_TESTERS"
          if [ -n "${FIREBASE_DISTRIBUTION_TESTERS:-}" ]; then
            RAW_TESTERS="${RAW_TESTERS},${FIREBASE_DISTRIBUTION_TESTERS}"
          fi

          NORMALIZED_TESTERS="$(
            printf '%s\n' "$RAW_TESTERS" \
              | tr ',;' '\n' \
              | tr -d '\r' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | awk 'NF' \
              | awk '!seen[tolower($0)]++' \
              | paste -sd, -
          )"

          NORMALIZED_GROUPS="$(
            printf '%s\n' "${FIREBASE_DISTRIBUTION_GROUPS:-}" \
              | tr ',;' '\n' \
              | tr -d '\r' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | awk 'NF' \
              | awk '!seen[tolower($0)]++' \
              | paste -sd, -
          )"

          DISTRIBUTE_ARGS=(
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            --app "$FIREBASE_APP_ID"
            --release-notes "$RELEASE_NOTES"
          )

          if [ -n "$NORMALIZED_TESTERS" ]; then
            echo "Firebase testers: $NORMALIZED_TESTERS"
            DISTRIBUTE_ARGS+=(--testers "$NORMALIZED_TESTERS")
          fi

          if [ -n "$NORMALIZED_GROUPS" ]; then
            echo "Firebase groups: $NORMALIZED_GROUPS"
            DISTRIBUTE_ARGS+=(--groups "$NORMALIZED_GROUPS")
          fi

          firebase appdistribution:distribute "${DISTRIBUTE_ARGS[@]}" | tee "$DISTRIBUTION_LOG"
