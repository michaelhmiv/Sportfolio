name: Firebase App Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional Firebase release name (defaults to commit SHA)"
        required: false
        type: string

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    env:
      CAP_SERVER_URL: https://www.sportfolio.market

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:client

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Firebase + signing secrets
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required=(
            FIREBASE_APP_ID
            FIREBASE_SERVICE_ACCOUNT
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret ${name}"
              exit 1
            fi
          done

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/upload-keystore.jks
          chmod 600 mobile/android/upload-keystore.jks

      - name: Compute release metadata
        env:
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          # Keep Firebase iteration builds above the Play internal workflow's
          # 200000-based versionCode range so testers can install newer Firebase
          # APKs over Play-delivered builds without manual downgrades.
          VERSION_CODE=$((300000 + ${GITHUB_RUN_NUMBER}))
          echo "MOBILE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          if [ -n "$INPUT_RELEASE_NAME" ]; then
            SANITIZED_RELEASE_NAME="$(printf '%s' "$INPUT_RELEASE_NAME" | tr '\r\n' '-' | tr -cd '[:alnum:]._-' | cut -c1-50)"
            if [ -z "$SANITIZED_RELEASE_NAME" ]; then
              echo "::error::release_name must contain at least one alphanumeric character after sanitization."
              exit 1
            fi
            echo "FIREBASE_RELEASE_NAME=$SANITIZED_RELEASE_NAME" >> "$GITHUB_ENV"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "FIREBASE_RELEASE_NAME=firebase-${SHORT_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MOBILE_VERSION_CODE: ${{ env.MOBILE_VERSION_CODE }}
          MOBILE_VERSION_NAME: ${{ env.FIREBASE_RELEASE_NAME }}
        run: node scripts/run-gradle-wrapper.mjs assembleRelease

      - name: Configure Firebase credentials (ADC)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Upload to Firebase App Distribution (CLI)
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_DISTRIBUTION_TESTERS }}
          FIREBASE_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_DISTRIBUTION_GROUPS }}
          FIREBASE_RELEASE_NAME: ${{ env.FIREBASE_RELEASE_NAME }}
          MOBILE_VERSION_CODE: ${{ env.MOBILE_VERSION_CODE }}
        run: |
          RELEASE_NOTES=$(cat <<EOF
          Build from commit ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Triggered by: ${GITHUB_ACTOR}
          Release: ${FIREBASE_RELEASE_NAME}
          Version code: ${MOBILE_VERSION_CODE}
          EOF
          )

          DISTRIBUTION_LOG="$RUNNER_TEMP/firebase-distribution.log"
          set -euo pipefail

          if [ -n "$FIREBASE_DISTRIBUTION_TESTERS" ]; then
            firebase appdistribution:distribute mobile/android/app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --testers "$FIREBASE_DISTRIBUTION_TESTERS" \
              --release-notes "$RELEASE_NOTES" | tee "$DISTRIBUTION_LOG"
          elif [ -n "$FIREBASE_DISTRIBUTION_GROUPS" ]; then
            firebase appdistribution:distribute mobile/android/app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_DISTRIBUTION_GROUPS" \
              --release-notes "$RELEASE_NOTES" | tee "$DISTRIBUTION_LOG"
          else
            firebase appdistribution:distribute mobile/android/app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --release-notes "$RELEASE_NOTES" | tee "$DISTRIBUTION_LOG"
          fi
