name: Temporary Retired Runtime Finalization

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: temporary-retired-runtime-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 389 &&
       github.event.comment.body == '/run-retired-runtime-finalization')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: test
      DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_deterministic_ci
    steps:
      - name: Check out authoritative task branch
        uses: actions/checkout@v5
        with:
          ref: deterministic/task-native-passwordless-handoff-376
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply checksum-pinned implementation
        run: python3 scripts/deterministic-task-patch.py

      - name: Remove task transport files
        run: |
          rm -f scripts/deterministic-task-patch.py
          rm -rf .deterministic-task

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: TypeScript
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Full test suite
        run: npm run test:run

      - name: Retired surface audit
        run: npm run retired-surfaces:audit

      - name: Public tool audit
        run: npm run public-tools:audit

      - name: Capability governance
        run: npm run governance:capabilities

      - name: MCP smoke
        run: npm run mcp:smoke

      - name: Production build
        run: npm run build

      - name: Commit validated implementation to PR 389
        run: |
          set -euo pipefail
          git config user.name "retired-runtime-finalizer[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes were produced." >&2
            exit 1
          fi
          git commit -m "refactor(mcp): remove retired runtime and curate MLB tools"
          git push origin HEAD:deterministic/task-native-passwordless-handoff-376
