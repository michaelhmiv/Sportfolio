name: Temporary Format Sanitizer

on:
  push:
    branches:
      - fix/player-display-names-mcp

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/player-display-names-mcp
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier server/mcp/plugin/sanitizer.ts --write
      - name: Commit formatter output
        run: |
          if git diff --quiet -- server/mcp/plugin/sanitizer.ts; then
            echo "Sanitizer already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mcp/plugin/sanitizer.ts
          git commit -m "style(plugin): apply repository Prettier"
          git push origin HEAD:fix/player-display-names-mcp
