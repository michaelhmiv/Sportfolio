name: Temporary submission refresh
on:
  push:
    branches:
      - feat/chatgpt-ui-dashboard-collections-rankings
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[submission-refresh]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_ENV: test
      DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_plugin_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-ui-dashboard-collections-rankings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate submission manifest
        run: npx tsx scripts/generate-chatgpt-app-submission.ts
      - name: Validate refreshed submission
        run: |
          npx tsx scripts/generate-chatgpt-app-submission.ts --check
          npx tsx scripts/plugin-submission-check.ts
          npm run governance:capabilities
      - name: Commit refreshed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-app-submission.json
          if git diff --cached --quiet; then
            echo "No submission changes required"
            exit 0
          fi
          git commit -m "Refresh ChatGPT app submission manifest [submission-refresh]"
          git push origin HEAD:feat/chatgpt-ui-dashboard-collections-rankings
