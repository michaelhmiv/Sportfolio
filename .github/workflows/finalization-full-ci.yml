name: Finalization Full CI

on:
  push:
    branches:
      - finalization/2026-08-07

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finalization/2026-08-07
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: node scripts/audit-retired-runtime.mjs
      - run: npm run check
      - name: Unit and integration tests
        shell: bash
        run: |
          set +e
          npm run test:run -- --reporter=default 2>&1 | tee /tmp/vitest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== COMPACT TEST FAILURE SUMMARY ====="
            grep -E -B 3 -A 12 'FAIL |Failed Tests|AssertionError|expected .* received|Error:|Test Files|Tests ' /tmp/vitest-output.txt | tail -n 700 || true
          fi
          exit "$status"
      - run: npm run build
