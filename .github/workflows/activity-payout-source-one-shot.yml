name: Activity payout source one-shot

on:
  push:
    branches: ["fix/activity-processed-payouts-source"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activity-processed-payouts-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply exact patch
        run: python tasks/apply_activity_source_fix.py
      - name: Validate
        run: |
          npm ci
          npx vitest run server/activity-feed.pending-payout.contract.test.ts
          npm run check
      - name: Commit and remove one-shot tooling
        run: |
          rm -f tasks/apply_activity_source_fix.py
          rm -f tasks/activity-processed-payouts-source.md
          rm -f .github/workflows/activity-payout-source-one-shot.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Filter pending payouts from Activity source"
          git push origin HEAD:fix/activity-processed-payouts-source
