name: iOS Readiness Prettier Autofix

on:
  pull_request:
    branches:
      - main
    paths:
      - "client/src/pages/contact.tsx"
      - "scripts/mobile-ios-doctor.mjs"
      - ".github/workflows/ios-readiness-prettier-autofix.yml"

permissions:
  contents: write

concurrency:
  group: ios-readiness-prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier to iOS readiness files
        run: npx prettier client/src/pages/contact.tsx scripts/mobile-ios-doctor.mjs --write

      - name: Commit formatted files if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- client/src/pages/contact.tsx scripts/mobile-ios-doctor.mjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/contact.tsx scripts/mobile-ios-doctor.mjs
          git commit -m "style(ios): apply Prettier to readiness changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
