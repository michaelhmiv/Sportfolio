name: Pull Request CI

on:
  pull_request:
    branches:
      - main
      - master

env:
  NODE_VERSION: "20"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Run tests
        run: npm run test:run
      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: npm audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Install Playwright browsers (report-only)
        run: npm run e2e:install
        continue-on-error: true
      - name: Integration tests (Playwright, report-only)
        run: npm run e2e
        continue-on-error: true
      - name: Dead code / unused exports (report-only)
        run: npm run code:dead
        continue-on-error: true
      - name: Duplicate code (report-only)
        run: npm run code:dup
        continue-on-error: true

      - name: Secret scan (Gitleaks, report-only)
        uses: gacts/gitleaks@v1
        continue-on-error: true
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: ./coverage/coverage-final.json
          flags: pr
          name: codecov-umbrella
          fail_ci_if_error: false
