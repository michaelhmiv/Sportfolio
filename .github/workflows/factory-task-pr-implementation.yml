name: Codex Task PR Implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .factory/tasks/**

permissions:
  contents: write

concurrency:
  group: codex-task-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.head_ref, 'factory/task-')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NODE_ENV: test
      DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_codex_ci
    steps:
      - name: Check out task branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve exactly one task contract
        id: task
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TASKS < <(find .factory/tasks -maxdepth 1 -type f -name '*.md' -print | sort)
          if [ "${#TASKS[@]}" -ne 1 ]; then
            echo "Expected exactly one .factory/tasks/*.md contract; found ${#TASKS[@]}." >&2
            exit 1
          fi
          echo "path=${TASKS[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies before sandboxing
        shell: bash
        run: npm ci

      - name: Implement task with OpenAI Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.task.outputs.path }}
          sandbox: workspace-write
          effort: high
          safety-strategy: drop-sudo
          allow-users: ${{ github.repository_owner }}

      - name: Enforce boundaries and commit implementation
        env:
          TASK_PATH: ${{ steps.task.outputs.path }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$TASK_PATH" .factory-implementation-report.md
          rmdir .factory/tasks 2>/dev/null || true
          rmdir .factory 2>/dev/null || true

          if git diff --name-only | grep -E '^\.github/workflows/'; then
            echo "Task implementation attempted to modify trusted workflow files." >&2
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "Codex implementation produced no repository changes." >&2
            exit 1
          fi

          git config user.name "openai-codex[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Codex task"
          git push origin "HEAD:$HEAD_BRANCH"
