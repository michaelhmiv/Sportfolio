name: Temporary Gameplay Test Formatter

on:
  push:
    branches:
      - feat/chatgpt-ui-game-mechanics-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/chatgpt-ui-game-mechanics-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/mcp/plugin/ui/gameplay-surface.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mcp/plugin/ui/gameplay-surface.test.ts
          git commit -m "Format gameplay presentation tests"
          git push origin HEAD:feat/chatgpt-ui-game-mechanics-v2
