name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional release label used for changelog metadata"
        required: false
        type: string
      cap_server_url:
        description: "Capacitor server URL for iOS shell sync"
        required: true
        default: "https://www.sportfolio.market"
        type: string
      skip_upload:
        description: "Build a signed IPA but skip TestFlight upload"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    env:
      IOS_APP_IDENTIFIER: com.sportfoliomarket.app
      IOS_PROJECT_PATH: App.xcodeproj
      IOS_SCHEME: App
      IOS_OUTPUT_DIR: tmp/ios-testflight
      IOS_BUILD_NUMBER_BASE: "400000"
      IOS_ARCHIVE_LOG: tmp/ios-testflight-build.log

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode 26 SDK toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify active Xcode version
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        env:
          CAP_SERVER_URL: ${{ inputs.cap_server_url }}
        run: npm run mobile:sync:ios

      - name: Run iOS guardrail doctor
        run: npm run mobile:ios:doctor

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate iOS release secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          required=(
            BUILD_CERTIFICATE_BASE64
            P12_PASSWORD
            BUILD_PROVISION_PROFILE_BASE64
            KEYCHAIN_PASSWORD
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret ${name}"
              exit 1
            fi
          done

          if [ "${{ inputs.skip_upload }}" != "true" ]; then
            upload_required=(
              APP_STORE_CONNECT_KEY_ID
              APP_STORE_CONNECT_ISSUER_ID
              APP_STORE_CONNECT_API_KEY_BASE64
            )

            for name in "${upload_required[@]}"; do
              if [ -z "${!name}" ]; then
                echo "::error::Missing required upload secret ${name}"
                exit 1
              fi
            done
          fi

      - name: Compute iOS release metadata
        env:
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          BUILD_NUMBER=$((IOS_BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER))
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          if [ -n "$INPUT_RELEASE_NAME" ]; then
            SANITIZED_RELEASE_NAME="$(
              printf '%s' "$INPUT_RELEASE_NAME" \
                | tr '\r\n' '-' \
                | tr -cd '[:alnum:]._-' \
                | cut -c1-50
            )"

            if [ -z "$SANITIZED_RELEASE_NAME" ]; then
              echo "::error::release_name must contain at least one alphanumeric character after sanitization."
              exit 1
            fi
            echo "IOS_RELEASE_NAME=$SANITIZED_RELEASE_NAME" >> "$GITHUB_ENV"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "IOS_RELEASE_NAME=testflight-${SHORT_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PLIST="$RUNNER_TEMP/build_profile.plist"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PROFILE_PLIST")
          APPLICATION_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID="${APPLICATION_IDENTIFIER#${TEAM_ID}.}"

          if [ "$PROFILE_BUNDLE_ID" != "$IOS_APP_IDENTIFIER" ]; then
            echo "::error::Provisioning profile bundle id ${PROFILE_BUNDLE_ID} does not match expected ${IOS_APP_IDENTIFIER}."
            exit 1
          fi

          mkdir -p "$PROFILE_DIRECTORY"
          cp "$PROFILE_PATH" "$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"

          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Install fastlane gems
        working-directory: mobile/ios/App
        run: bundle install --path vendor/bundle

      - name: Build and optionally upload to TestFlight
        working-directory: mobile/ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$IOS_ARCHIVE_LOG")"
          bundle exec fastlane ios testflight_ci \
            skip_upload:${{ inputs.skip_upload }} \
            release_name:"${IOS_RELEASE_NAME}" 2>&1 | tee "$IOS_ARCHIVE_LOG"

      - name: Upload iOS TestFlight artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-testflight-failure-artifacts-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.IOS_ARCHIVE_LOG }}
            mobile/ios/App/${{ env.IOS_OUTPUT_DIR }}

      - name: Cleanup signing materials
        if: ${{ always() }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -n "${IOS_PROFILE_UUID:-}" ] && [ -f "$PROFILE_DIRECTORY/$IOS_PROFILE_UUID.mobileprovision" ]; then
            rm -f "$PROFILE_DIRECTORY/$IOS_PROFILE_UUID.mobileprovision"
          fi

          if [ -n "${IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
