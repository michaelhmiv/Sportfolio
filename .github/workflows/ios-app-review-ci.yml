name: iOS App Review CI

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/ios-*.yml"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "mobile/ios/**"
      - "mobile/README.md"
      - "docs/ios-*.md"
      - "scripts/fix-ios-spm-paths.mjs"
      - "scripts/mobile-ios-doctor.mjs"
      - "scripts/mobile-ios-privacy-manifest-audit.sh"
      - "scripts/app-store-connect-submission-prep.mjs"
      - "scripts/ios-app-store-screenshots.mjs"
      - "client/src/**"
      - "shared/**"
      - "migrations/**"
      - "server/auth/**"
      - "server/profile/**"
      - "server/routes/mobile-**"
      - "server/services/rewarded-scout-boost*"

permissions:
  contents: read

concurrency:
  group: ios-app-review-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-validate:
    name: ios-validate
    runs-on: macos-latest
    env:
      CAP_SERVER_URL: https://www.sportfolio.market
      IOS_BUILD_LOG: tmp/ios-build.log
      IOS_DERIVED_DATA: tmp/ios-derived-data
      IOS_PRIVACY_MANIFEST_REPORT: tmp/ios-privacy-manifests.txt

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select current App Store Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify active Xcode version
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npm run mobile:sync:ios

      - name: Run iOS and App Store readiness doctor
        run: npm run mobile:ios:doctor

      - name: Run iOS-specific unit tests
        run: |
          npm run test:run -- \
            client/src/lib/ad-report.test.ts \
            client/src/hooks/use-rewarded-scout-boost.test.ts

      - name: Build unsigned iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${IOS_DERIVED_DATA}"
          npm run mobile:build:ios:ci 2>&1 | tee "${IOS_BUILD_LOG}"

      - name: Audit iOS privacy manifests
        env:
          IOS_PRIVACY_SCAN_ROOTS: ${{ github.workspace }}/${{ env.IOS_DERIVED_DATA }}
        run: bash scripts/mobile-ios-privacy-manifest-audit.sh

      - name: Upload iOS build artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-review-ci-failure-artifacts
          if-no-files-found: warn
          path: |
            ${{ env.IOS_BUILD_LOG }}
            ${{ env.IOS_PRIVACY_MANIFEST_REPORT }}
            ${{ env.IOS_DERIVED_DATA }}
