name: Analytics Contract Fix

on:
  push:
    branches:
      - codex/analytics-market-terminal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/analytics-market-terminal
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile intended analytics contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          scheduler = Path('server/jobs/scheduler.test.ts')
          text = scheduler.read_text()
          text = text.replace(
              '  refresh_player_volume_24h: "4-59/10 * * * *",\n  stats_sync_live:',
              '  refresh_player_volume_24h: "4-59/10 * * * *",\n  market_snapshot: "5 0 * * *",\n  portfolio_snapshot: "10 0 * * *",\n  stats_sync_live:'
          )
          text = text.replace('expect(scheduler.getConfiguredJobs()).toHaveLength(33);', 'expect(scheduler.getConfiguredJobs()).toHaveLength(35);')
          text = text.replace('expect(schedulerMocks.schedule).toHaveBeenCalledTimes(33);', 'expect(schedulerMocks.schedule).toHaveBeenCalledTimes(35);')
          scheduler.write_text(text)

          mcp = Path('server/mcp/mcp-server.test.ts')
          text = mcp.read_text()
          text = text.replace(
              'import { startMockMcpHttpServer } from "./testing";',
              'import { getMarketResearchToolNames } from "./market-research-tools";\nimport { startMockMcpHttpServer } from "./testing";'
          )
          text = text.replace(
              'expect(tools.tools).toHaveLength(buildPublicMcpToolRegistry().length);',
              'expect(tools.tools).toHaveLength(\n        buildPublicMcpToolRegistry().length + getMarketResearchToolNames().length,\n      );\n      expect(tools.tools.map((entry) => entry.name)).toEqual(\n        expect.arrayContaining(getMarketResearchToolNames()),\n      );'
          )
          mcp.write_text(text)

          analytics = Path('client/src/pages/analytics.tsx')
          analytics.write_text(analytics.read_text().replace(' ↔ ', ' vs '))

          nav = Path('client/src/lib/app-navigation.test.tsx')
          nav.write_text(nav.read_text().replace('      "collections",\n    ]);', '      "analytics",\n    ]);'))
          PY
          rm -f ci-analytics-coverage.txt .github/workflows/analytics-coverage-diagnostic.yml
          npx prettier --write server/jobs/scheduler.test.ts server/mcp/mcp-server.test.ts client/src/pages/analytics.tsx client/src/lib/app-navigation.test.tsx
      - name: Verify focused contracts
        run: >-
          npx vitest run
          server/jobs/scheduler.test.ts
          server/mcp/mcp-server.test.ts
          client/src/components/core-exchange.contract.test.ts
          client/src/lib/app-navigation.test.tsx
          server/analytics/market-research.test.ts
          server/mcp/market-research-tools.test.ts
      - name: Commit contract reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align analytics contracts with market terminal"
          git push origin HEAD:codex/analytics-market-terminal
