name: Code Validation

on:
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".github/workflows/ios-*"
      - ".github/workflows/play-*"
      - ".github/workflows/firebase-*"
      - "mobile/ios/**"
      - "mobile/android/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".github/workflows/ios-*"
      - ".github/workflows/play-*"
      - ".github/workflows/firebase-*"
      - "mobile/ios/**"
      - "mobile/android/**"

permissions:
  contents: read

concurrency:
  group: code-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Retired runtime governance
        run: npm run retired-runtime:audit

      - name: Run tests
        if: github.event_name == 'push'
        run: npm run test:run

      - name: Run tests with coverage thresholds
        if: github.event_name == 'pull_request'
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Chromium for critical smoke tests
        run: npx playwright install --with-deps chromium

      - name: Critical browser smoke tests
        run: >-
          npx playwright test
          tests/e2e/smoke.spec.ts
          tests/e2e/valuation-integrity.spec.ts

      - name: Integration tests (report-only)
        if: github.event_name == 'pull_request'
        run: npm run e2e
        continue-on-error: true

      - name: Dead code and unused exports (report-only)
        if: github.event_name == 'pull_request'
        run: npm run code:dead
        continue-on-error: true

      - name: Duplicate code (report-only)
        if: github.event_name == 'pull_request'
        run: npm run code:dup
        continue-on-error: true

      - name: Upload coverage reports
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: ./coverage/coverage-final.json
          flags: pr
          name: codecov-umbrella
          fail_ci_if_error: false
