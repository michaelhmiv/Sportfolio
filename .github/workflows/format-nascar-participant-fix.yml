name: Format NASCAR participant fix

on:
  push:
    branches:
      - fix/nascar-result-participant-admission

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/nascar-result-participant-admission
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed NASCAR files
        run: npx prettier --write server/jobs/sync-nascar-stats.ts server/jobs/sync-nascar-stats.test.ts
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-nascar-participant-fix.yml
          git add server/jobs/sync-nascar-stats.ts server/jobs/sync-nascar-stats.test.ts
          git commit -m "style(nascar): format participant admission fix"
          git push origin HEAD:fix/nascar-result-participant-admission
