name: Factory Issue Implementation

"on":
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: factory-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: ${{ github.event.issue.pull_request == null && github.actor == github.repository_owner && startsWith(github.event.comment.body, '/factory-implement') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NODE_ENV: test
      DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_factory_ci
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Create implementation branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="factory/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Factory Droid CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build implementation prompt
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue = event["issue"]
          prompt = f"""Implement GitHub issue #{issue['number']} in this repository.

TITLE
{issue['title']}

ISSUE CONTRACT
{issue.get('body') or ''}

EXECUTION RULES
- Inspect the repository before editing and preserve established architecture and conventions.
- Implement the complete issue scope, not merely a plan or report.
- Work only in the current checkout. Do not push, merge, rewrite history, alter repository settings, expose secrets, or change Railway.
- Keep database work explicit and rollback-safe. Do not execute destructive production migrations.
- Update affected source, tests, snapshots, generated contracts, current documentation, and configuration examples.
- Run relevant tests while implementing and fix failures caused by the changes.
- Do not modify files under .github/workflows/.
- Write a concise implementation summary, deletion/migration inventory, tests run, known limitations, and rollback instructions to .factory-implementation-report.md.
"""
          Path(".factory-task.md").write_text(prompt, encoding="utf-8")
          PY

      - name: Implement issue with Factory Droid
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          droid exec --auto high -f .factory-task.md

      - name: Reject trusted workflow changes
        shell: bash
        run: |
          if git diff --name-only | grep -E '^\.github/workflows/'; then
            echo "Implementation attempted to modify trusted workflow files." >&2
            exit 1
          fi

      - name: Run independent validation
        id: validate
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/factory-validation.md"
          : > "$report"
          overall=0

          run_check() {
            label="$1"
            shift
            {
              echo "## $label"
              echo '```text'
              "$@"
              status=$?
              echo '```'
              if [ "$status" -eq 0 ]; then
                echo "Result: PASS"
              else
                echo "Result: FAIL (exit $status)"
                overall=1
              fi
              echo
            } >> "$report" 2>&1
          }

          run_check "TypeScript check" npm run check
          run_check "ESLint" npm run lint
          run_check "Formatting" npm run format:check
          run_check "Full test suite" timeout 35m npm run test:run
          run_check "Public tool policy" npm run public-tools:audit
          if npm run | grep -q 'retired-surfaces:audit'; then
            run_check "Retired surface audit" npm run retired-surfaces:audit
          fi
          run_check "Production build" npm run build

          cat "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare commit and pull request
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.validate.outputs.report }}" "$RUNNER_TEMP/validation.md"
          if [ -f .factory-implementation-report.md ]; then
            cp .factory-implementation-report.md "$RUNNER_TEMP/implementation.md"
          else
            printf '%s\n' 'Factory Droid did not generate a separate implementation report.' > "$RUNNER_TEMP/implementation.md"
          fi

          rm -f .factory-task.md .factory-implementation-report.md

          if [ -z "$(git status --porcelain)" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "Factory implementation produced no repository changes. Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi

          {
            echo "Implements #${{ github.event.issue.number }}"
            echo
            echo "## Factory implementation report"
            cat "$RUNNER_TEMP/implementation.md"
            echo
            echo "## Independent validation"
            cat "$RUNNER_TEMP/validation.md"
            echo
            echo "## Review gate"
            echo "Review the complete diff, normal repository checks, beta deployment, and Railway logs before merge."
          } > "$RUNNER_TEMP/pr-body.md"

          if [ "${{ steps.validate.outputs.overall }}" = "0" ]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "factory-droid[bot]"
          git config user.email "138933559+factory-droid[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement issue #${{ github.event.issue.number }}"
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          args=(--base main --head "${{ steps.branch.outputs.name }}" --title "${{ github.event.issue.title }}" --body-file "$RUNNER_TEMP/pr-body.md")
          if [ "${{ steps.prepare.outputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          url=$(gh pr create "${args[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Link pull request to issue
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Implementation PR created: ${{ steps.pr.outputs.url }}\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
