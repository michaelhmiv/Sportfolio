name: Finalization Fix Collection Lock

on:
  push:
    branches:
      - finalization/2026-08-07
    paths:
      - .github/workflows/finalization-fix-collection-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finalization/2026-08-07
          fetch-depth: 0
      - name: Apply minimal advisory-lock repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/collections/postgres-repository.ts')
          text = path.read_text()

          old_import = 'import { holdingReservationDomain, loadPlayerIdentityContext } from "../player-identity";\n'
          new_import = old_import + 'import { advisoryLockKeyPair } from "../utils/advisory-lock-key";\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'expected one player-identity import, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_domain = '    const reservationDomain = holdingReservationDomain(input.userId, "player", identityIds);\n\n'
          new_domain = (
              '    const reservationDomain = holdingReservationDomain(input.userId, "player", identityIds);\n'
              '    const [reservationLockKeyA, reservationLockKeyB] = advisoryLockKeyPair(reservationDomain);\n\n'
          )
          if text.count(old_domain) != 1:
              raise SystemExit(f'expected one collection reservation domain block, found {text.count(old_domain)}')
          text = text.replace(old_domain, new_domain, 1)

          old_lock = '      sql`SELECT pg_advisory_xact_lock(hashtextextended(${reservationDomain}, 0))`,\n'
          new_lock = '      sql`SELECT pg_advisory_xact_lock(${reservationLockKeyA}, ${reservationLockKeyB})`,\n'
          if text.count(old_lock) != 1:
              raise SystemExit(f'expected one old collection reservation lock, found {text.count(old_lock)}')
          text = text.replace(old_lock, new_lock, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- server/collections/postgres-repository.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/collections/postgres-repository.ts
          git commit -m "fix: unify collection reservation advisory lock keys"
          git push origin HEAD:finalization/2026-08-07
