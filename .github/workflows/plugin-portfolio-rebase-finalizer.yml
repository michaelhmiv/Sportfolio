name: Plugin Portfolio Repair Rebase Finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

concurrency:
  group: plugin-portfolio-rebase-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.event.pull_request.number == 462 && github.event.pull_request.head.ref == 'fix/plugin-portfolio-contract-currency-audit' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/plugin-portfolio-contract-currency-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Merge current main and resolve known overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "plugin-repair-finalizer[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [[ "${merge_status}" -ne 0 ]]; then
            echo "Merge reported conflicts; resolving the audited overlap set."
          fi

          # Economy cleanup intentionally deleted this legacy widget. Never resurrect it.
          git rm -f client/src/plugin-ui/sportfolio-widget.tsx 2>/dev/null || true

          # Keep the SB formatter repair while preserving the current Economy V2 column language.
          if git ls-files -u -- client/src/plugin-ui/sportfolio-market-portfolio-widget.tsx | grep -q .; then
            git checkout --ours client/src/plugin-ui/sportfolio-market-portfolio-widget.tsx
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("client/src/plugin-ui/sportfolio-market-portfolio-widget.tsx")
          text = path.read_text()
          text = text.replace("<th>Gameplay Power</th>", "<th>Position value</th>")
          path.write_text(text)
          PY
          git add client/src/plugin-ui/sportfolio-market-portfolio-widget.tsx

          # The repair glossary already expresses the final Singles + direct-share Boost contract.
          if git ls-files -u -- docs/wiki/faq/glossary.md | grep -q .; then
            git checkout --ours docs/wiki/faq/glossary.md
          fi
          git add docs/wiki/faq/glossary.md

          # Start from current main's direct-share schemas, then apply only the SB/Singles descriptions.
          if git ls-files -u -- server/mcp/public-tool-registry.ts | grep -q .; then
            git checkout --theirs server/mcp/public-tool-registry.ts
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("server/mcp/public-tool-registry.ts")
          text = path.read_text()
          old = 'description: "Read the user\'s portfolio summary and operator overview.",'
          new = 'description:\n      "Read the user\'s portfolio summary and operator overview. Monetary amounts are virtual Sportfolio Bucks (SB).",'
          if old not in text:
              raise SystemExit("get_portfolio_summary description anchor not found")
          text = text.replace(old, new, 1)
          old = 'description: "List current player holdings and available shares.",'
          new = 'description:\n      "List current Singles holdings and available shares under the current Economy V2 model.",'
          if old not in text:
              raise SystemExit("get_holdings description anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git add server/mcp/public-tool-registry.ts

          # The artifact is regenerated below from the fully merged source tree.
          if git ls-files -u -- server/mcp/plugin/ui/generated-widget.ts | grep -q .; then
            git checkout --theirs server/mcp/plugin/ui/generated-widget.ts
          fi
          git add server/mcp/plugin/ui/generated-widget.ts

          remaining="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${remaining}" ]]; then
            echo "Unexpected unresolved merge conflicts:"
            echo "${remaining}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Rebuild merged ChatGPT widget
        run: npm run plugin:ui:build

      - name: Format merged hand-edited files
        run: |
          npx prettier --write \
            client/src/plugin-ui/sportfolio-market-portfolio-widget.tsx \
            docs/wiki/faq/glossary.md \
            server/mcp/public-tool-registry.ts

      - name: Validate merged repair
        run: |
          npm run check
          npm run retired-runtime:audit
          npx vitest run \
            client/src/plugin-ui/virtual-currency.test.ts \
            server/mcp/plugin/ui/presentation-contract.test.ts \
            server/valuation/canonical-valuation.test.ts \
            server/mcp/public-tool-registry.economy-v2.test.ts
          npm run plugin:ui:audit

      - name: Commit clean rebased repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/plugin-portfolio-rebase-finalizer.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Expected merged changes were not staged."
            exit 1
          fi
          git commit -m "Rebase plugin portfolio repair onto Economy V2 cleanup"
          git push origin HEAD:fix/plugin-portfolio-contract-currency-audit
