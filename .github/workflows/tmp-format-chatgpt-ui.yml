name: Temporary ChatGPT UI Formatter

on:
  push:
    branches:
      - "feat/chatgpt-ui-foundation-v2"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-ui-foundation-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier client/src/plugin-ui/sportfolio-widget-v2.tsx client/src/plugin-ui/openai-host.ts scripts/build-plugin-ui.mjs --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/plugin-ui/sportfolio-widget-v2.tsx client/src/plugin-ui/openai-host.ts scripts/build-plugin-ui.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format ChatGPT UI foundation"
          git push origin HEAD:feat/chatgpt-ui-foundation-v2
