name: Temporary ChatGPT UI Formatter

on:
  push:
    branches:
      - feat/chatgpt-ui-game-mechanics-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/chatgpt-ui-game-mechanics-v2
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format affected UI files
        run: npx prettier --write client/src/plugin-ui/sportfolio-gameplay-widget.tsx client/src/plugin-ui/sportfolio-market-portfolio-widget.tsx server/mcp/plugin/ui/gameplay-surface.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/plugin-ui/sportfolio-gameplay-widget.tsx client/src/plugin-ui/sportfolio-market-portfolio-widget.tsx server/mcp/plugin/ui/gameplay-surface.ts
          git commit -m "Format ChatGPT UI surfaces"
          git push origin HEAD:feat/chatgpt-ui-game-mechanics-v2
