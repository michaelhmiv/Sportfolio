name: One-shot Baseline Type Fix

on:
  push:
    branches:
      - plugin/14-release-candidate
    paths:
      - .github/workflows/one-shot-baseline-type-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plugin/14-release-candidate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact type-safety patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}; found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "client/src/pages/collection-detail.test.tsx",
              '''    statKey: "hr",
              allocation: null,''',
              '''    statKey: "hr",
              qualificationValue: null,
              qualificationMetadata: null,
              statLabel: "HR",
              allocation: null,''',
          )

          replace_once(
              "client/src/pages/collection-detail.tsx",
              '''                const canSubmit =
                  !isSubmitting && parsed !== null && parsed !== "0.0000" && withinAvailableMaximum;

                return (''',
              '''                const canSubmit =
                  !isSubmitting && parsed !== null && parsed !== "0.0000" && withinAvailableMaximum;
                const player = slot.player;

                return (''',
          )
          replace_once(
              "client/src/pages/collection-detail.tsx",
              '''                        {slot.player && (
                          <span className="flex items-center gap-1.5">
                            <span
                              className="text-primary underline cursor-pointer hover:text-brand transition-colors"
                              onClick={() => openPlayerModal(slot.player.playerId)}
                            >
                              {`${slot.player.firstName} ${slot.player.lastName}`.trim() || "--"}
                            </span>
                            <span className="text-muted-foreground">&middot;</span>
                            <span className="text-muted-foreground">{slot.player.team}</span>
                            <span className="text-muted-foreground">&middot;</span>
                            <span className="text-muted-foreground">{slot.player.position}</span>''',
              '''                        {player && (
                          <span className="flex items-center gap-1.5">
                            <span
                              className="text-primary underline cursor-pointer hover:text-brand transition-colors"
                              onClick={() => openPlayerModal(player.playerId)}
                            >
                              {`${player.firstName} ${player.lastName}`.trim() || "--"}
                            </span>
                            <span className="text-muted-foreground">&middot;</span>
                            <span className="text-muted-foreground">{player.team}</span>
                            <span className="text-muted-foreground">&middot;</span>
                            <span className="text-muted-foreground">{player.position}</span>''',
          )

          replace_once(
              "server/collections/read-repository.ts",
              '''      qualificationMetadata: row.qualificationMetadata ?? null,''',
              '''      qualificationMetadata:
                (row.qualificationMetadata as Record<string, unknown> | null) ?? null,''',
          )

          replace_once(
              "server/public-identities/identity-events.ts",
              '''let _broadcast: ((message: { type: string; [key: string]: unknown }) => void) | null = null;

          export function setBroadcastFn(fn: (message: { type: string; [key: string]: unknown }) => void): void {''',
              '''let _broadcast: ((message: { type: "identity"; [key: string]: unknown }) => void) | null = null;

          export function setBroadcastFn(
            fn: (message: { type: "identity"; [key: string]: unknown }) => void,
          ): void {''',
          )
          PY

      - run: npm ci

      - name: Full repository typecheck
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Relevant regression tests
        run: >-
          npx vitest run
          client/src/pages/collection-detail.test.tsx
          server/public-identities/identity-events.test.ts
          server/mcp/plugin/capability-policy.test.ts
          server/mcp/plugin/adapters.test.ts
          server/auth/plugin-token-verifier.test.ts

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/collection-detail.test.tsx \
            client/src/pages/collection-detail.tsx \
            server/collections/read-repository.ts \
            server/public-identities/identity-events.ts
          git commit -m "fix: resolve collection and websocket type errors"
          git push origin HEAD:plugin/14-release-candidate
