name: Refresh Capability Snapshot

on:
  push:
    branches: [fix/plugin-ui-runtime-rendering-20260811]

permissions:
  contents: write

env:
  NODE_ENV: test
  DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_plugin_ci

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/plugin-ui-runtime-rendering-20260811
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run governance:capabilities:update
      - run: npm run governance:capabilities
      - run: |
          if [ -z "$(git status --porcelain -- config/public-capability-snapshot.json)" ]; then exit 0; fi
          git config user.name "Sportfolio Automation"
          git config user.email "34044957+michaelhmiv@users.noreply.github.com"
          git add config/public-capability-snapshot.json
          git commit -m "chore(governance): refresh Economy V2 capability snapshot"
          git push origin HEAD:fix/plugin-ui-runtime-rendering-20260811
