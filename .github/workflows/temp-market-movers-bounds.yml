name: Temporary market movers patch

on:
  push:
    branches:
      - perf/market-movers-bounded-candidates-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/market-movers-bounded-candidates-v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Bound exact-order candidate categories
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'server/mcp/plugin/ui/surface.ts';
          let text = fs.readFileSync(path, 'utf8');
          const before = `  const sortBy = category === "volume" || category === "most_traded" ? "volume" : "change";\n  const sortOrder = category === "decliners" ? "asc" : "desc";\n  const result = await storage.getPlayersPaginated({\n    sport: requestedSport || undefined,\n    limit: 100,`;
          const after = `  const sortBy = category === "volume" || category === "most_traded" ? "volume" : "change";\n  const sortOrder = category === "decliners" ? "asc" : "desc";\n  // Change-sorted categories use the same 24-hour AMM price-change formula in SQL\n  // and batch enrichment, so only the requested result window is needed. Volume\n  // and most-traded retain the broad candidate set because their final pool metrics\n  // are not identical to the database's 24-hour volume ordering.\n  const candidateLimit =\n    category === "gainers" || category === "decliners" || category === "watchlist"\n      ? limit\n      : 100;\n  const result = await storage.getPlayersPaginated({\n    sport: requestedSport || undefined,\n    limit: candidateLimit,`;
          if (!text.includes(before)) throw new Error('target snippet not found');
          text = text.replace(before, after);
          fs.writeFileSync(path, text);
          NODE
          npx prettier server/mcp/plugin/ui/surface.ts --write
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-market-movers-bounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mcp/plugin/ui/surface.ts .github/workflows/temp-market-movers-bounds.yml
          git commit -m "perf(plugin-ui): bound exact-order mover candidates"
          git push origin HEAD:perf/market-movers-bounded-candidates-v2
