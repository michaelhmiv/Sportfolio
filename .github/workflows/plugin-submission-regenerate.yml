name: Regenerate Plugin Submission

on:
  push:
    branches: [fix/plugin-ui-runtime-rendering-20260811]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/plugin-ui-runtime-rendering-20260811
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx scripts/generate-chatgpt-app-submission.ts
      - run: |
          if [ -z "$(git status --porcelain -- chatgpt-app-submission.json)" ]; then exit 0; fi
          git config user.name "Sportfolio Automation"
          git config user.email "34044957+michaelhmiv@users.noreply.github.com"
          git add chatgpt-app-submission.json
          git commit -m "chore(plugin): regenerate Economy V2 submission manifest"
          git push origin HEAD:fix/plugin-ui-runtime-rendering-20260811
