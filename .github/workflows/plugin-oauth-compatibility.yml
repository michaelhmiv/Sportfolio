name: Plugin OAuth Compatibility

on:
  push:
    branches:
      - plugin/02-oauth-compatibility
  pull_request:
    paths:
      - "scripts/plugin-oauth-*.ts"
      - "docs/plugin/**"
      - ".github/workflows/plugin-oauth-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-oauth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLUGIN_OAUTH_ISSUER: ${{ github.event_name == 'pull_request' && 'https://beta.sportfolio.market/api/auth/better' || 'https://www.sportfolio.market/api/auth/better' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Better Auth OAuth discovery and JWKS probe
        run: npx tsx scripts/plugin-oauth-discovery-check.ts

      - name: Run OAuth compatibility unit tests
        run: npx vitest run scripts/plugin-oauth-discovery-check.test.ts scripts/plugin-oauth-token-inspect.test.ts
