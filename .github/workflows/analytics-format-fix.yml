name: Analytics Format Fix

on:
  push:
    branches:
      - codex/analytics-market-terminal

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/analytics-market-terminal
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format analytics files
        run: >-
          npx prettier --write
          client/src/pages/analytics.tsx
          server/analytics/market-research.ts
          server/mcp/market-research-tools.ts
          server/routes/analytics-v2.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/analytics.tsx server/analytics/market-research.ts server/mcp/market-research-tools.ts server/routes/analytics-v2.ts
          git commit -m "style: format analytics market terminal"
          git push origin HEAD:codex/analytics-market-terminal
