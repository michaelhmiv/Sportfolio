name: One-shot plugin portfolio repair

on:
  push:
    branches:
      - fix/plugin-portfolio-contract-currency-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/plugin-portfolio-contract-currency-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply audited repair
        run: node scripts/one-shot-plugin-portfolio-repair.mjs
      - name: Format changed source
        run: >-
          npx prettier --write
          server/mcp/plugin/server.ts
          server/mcp/plugin/ui/presentation-contract.ts
          server/mcp/plugin/ui/presentation-contract.test.ts
          server/valuation/canonical-valuation.ts
          server/valuation/canonical-valuation.test.ts
          server/mcp/native-operations.ts
          server/mcp/public-tool-registry.ts
          client/src/plugin-ui/virtual-currency.ts
          client/src/plugin-ui/virtual-currency.test.ts
          client/src/plugin-ui/sportfolio-market-portfolio-widget.tsx
          client/src/plugin-ui/sportfolio-overview-widget.tsx
          client/src/plugin-ui/sportfolio-widget-v2.tsx
          client/src/plugin-ui/sportfolio-widget.tsx
          plugins/sportfolio/skills/sportfolio-companion/SKILL.md
          docs/wiki/faq/glossary.md
      - name: Rebuild self-contained plugin widget
        run: npm run plugin:ui:build
      - name: Targeted regression tests
        run: >-
          npx vitest run
          server/valuation/canonical-valuation.test.ts
          server/mcp/plugin/ui/presentation-contract.test.ts
          client/src/plugin-ui/virtual-currency.test.ts
          server/mcp/plugin/ui/protocol-resource.test.ts
          server/mcp/plugin/ui/shared-resource.test.ts
      - name: Typecheck
        run: npm run check
      - name: Plugin UI audit
        run: npm run plugin:ui:audit
      - name: Retired runtime audit
        run: npm run retired-runtime:audit
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden plugin portfolio cards and SB semantics"
          git push origin HEAD:fix/plugin-portfolio-contract-currency-audit
