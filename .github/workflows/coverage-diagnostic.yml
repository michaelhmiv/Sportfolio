name: Coverage diagnostic

on:
  push:
    branches:
      - cleanup/operational-truth

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run coverage and print compact tail
        shell: bash
        run: |
          set +e
          npm run test:coverage -- --reporter=dot > coverage-output.txt 2>&1
          status=$?
          echo '--- coverage summary ---'
          tail -n 120 coverage-output.txt
          exit "$status"
