name: Sync Mobile Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build web app
        run: npm run build:client
        
      - name: Sync Capacitor
        run: npx cap sync
        
      - name: Check for native changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain mobile/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Create iOS PR
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: mobile/ios-sync-${{ github.run_number }}
          title: "📱 iOS Sync: Update from web build ${{ github.sha }}"
          body: |
            ## Automated iOS Build Sync
            
            This PR was automatically created when changes were pushed to main.
            
            ### Changes
            - Web build: ${{ github.sha }}
            - Triggered by: ${{ github.event.head_commit.message }}
            
            ### Files Changed
            - Updated `mobile/ios/App/public/` with latest web build
            - Synced native configuration if needed
            
            ### Next Steps
            1. Review changes (should just be www/ folder updates)
            2. Test on iOS device/simulator if needed
            3. Merge to deploy to TestFlight (if Fastlane is configured)
            
            ---
            *Auto-generated by GitHub Actions*
          commit-message: "chore(mobile): sync iOS build from ${{ github.sha }}"
          committer: GitHub Actions <actions@github.com>
          author: GitHub Actions <actions@github.com>
          
      - name: Create Android PR
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: mobile/android-sync-${{ github.run_number }}
          title: "📱 Android Sync: Update from web build ${{ github.sha }}"
          body: |
            ## Automated Android Build Sync
            
            This PR was automatically created when changes were pushed to main.
            
            ### Changes
            - Web build: ${{ github.sha }}
            - Triggered by: ${{ github.event.head_commit.message }}
            
            ### Files Changed
            - Updated `mobile/android/app/src/main/assets/public/` with latest web build
            - Synced native configuration if needed
            
            ### Next Steps
            1. Review changes (should just be www/ folder updates)
            2. Test on Android device/emulator if needed
            3. Merge to deploy to Play Store Internal (if Fastlane is configured)
            
            ---
            *Auto-generated by GitHub Actions*
          commit-message: "chore(mobile): sync Android build from ${{ github.sha }}"
          committer: GitHub Actions <actions@github.com>
          author: GitHub Actions <actions@github.com>
