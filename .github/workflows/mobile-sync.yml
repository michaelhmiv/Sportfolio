name: Sync Mobile Apps

on:
  push:
    branches: [main]
    paths:
      - "client/src/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "client/src/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:client

      - name: Sync Capacitor
        run: npx cap sync

      - name: Report native changes
        run: |
          if [ -n "$(git status --porcelain mobile/)" ]; then
            echo "Native mobile files changed after sync."
            git status --short mobile/
          else
            echo "No native mobile changes detected after sync."
          fi
