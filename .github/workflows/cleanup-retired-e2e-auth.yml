name: Cleanup retired E2E auth fixtures

on:
  push:
    branches:
      - cleanup/operational-truth

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/operational-truth
          fetch-depth: 0
      - name: Remove retired Supabase route fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path('tests/e2e'), Path('tests/visual')]
          changed = []

          def strip_route_blocks(text: str) -> str:
              lines = text.splitlines(keepends=True)
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  lower = line.lower()
                  if 'const mock_supabase_url' in lower:
                      i += 1
                      continue
                  if 'await page.route' in lower and ('/api/auth/config' in lower or 'supabase' in lower):
                      depth = 0
                      started = False
                      while i < len(lines):
                          current = lines[i]
                          depth += current.count('{') - current.count('}')
                          if '{' in current:
                              started = True
                          i += 1
                          if started and depth <= 0:
                              break
                      while i < len(lines) and lines[i].strip() == '':
                          i += 1
                      continue
                  out.append(line)
                  i += 1
              return ''.join(out)

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.ts'):
                  before = path.read_text(encoding='utf-8')
                  after = strip_route_blocks(before)
                  if after != before:
                      path.write_text(after, encoding='utf-8')
                      changed.append(str(path))

          remaining = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.ts', '.tsx', '.js', '.mjs'}:
                      text = path.read_text(encoding='utf-8').lower()
                      if 'supabase' in text or '/api/auth/config' in text:
                          remaining.append(str(path))
          if remaining:
              raise SystemExit('Retired auth fixtures remain: ' + ', '.join(remaining))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/cleanup-retired-e2e-auth.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e tests/visual .github/workflows/cleanup-retired-e2e-auth.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(auth): remove retired Supabase E2E fixtures'
          git push origin HEAD:cleanup/operational-truth
