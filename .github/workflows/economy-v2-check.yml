name: Economy V2 Validation Runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.pull_request &&
      github.event.issue.number == 450 &&
      contains(github.event.comment.body, '@economy-v2-check')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: factory/task-economy-v2-direct-boosts
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Economy V2 unit tests
        run: npx vitest run server/economy/math.test.ts server/jobs/settle-boosts.test.ts server/jobs/settle-share-payouts.test.ts server/jobs/snapshot-share-payouts.test.ts server/boosts/assign-daily-boost.test.ts
      - name: Retired Stack audit
        run: node scripts/audit-economy-v2-retired-stack.mjs
      - name: Public tool policy
        run: npm run public-tools:audit
      - name: Capability governance
        run: npm run governance:capabilities
      - name: MCP audit
        run: npm run mcp:audit
      - name: Plugin UI audit
        run: npm run plugin:ui:audit
      - name: Docs governance
        run: npm run docs:governance
      - name: Production build
        run: npm run build
