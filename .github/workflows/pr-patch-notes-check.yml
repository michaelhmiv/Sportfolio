name: PR Patch Notes Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  patch-notes-check:
    name: Validate PR Patch Notes
    runs-on: ubuntu-latest
    steps:
      - name: Validate `## Patch Notes` section and manage warning comment
        uses: actions/github-script@v9
        with:
          script: |
            const MARKER = '<!-- patch-notes-check -->';
            const WARNING_BODY = `${MARKER}\n**Patch Notes Required**\n\nPlease add a non-empty \`## Patch Notes\` section to this PR description before merge.\n\nKeep it player-visible and concise (1-5 bullets): what changed, why it matters, and any user-facing impact.`;
            const PATCH_NOTES_HEADING_RE = /^##\s+patch notes\s*$/i;
            const H2_RE = /^##\s+\S+/;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const issueNumber = pr.number;
            const prBody = String(pr.body || '').replace(/\r\n/g, '\n');
            const isDraft = Boolean(pr.draft);

            function extractPatchNotesSection(markdown) {
              const lines = markdown.split('\n');
              const start = lines.findIndex((line) => PATCH_NOTES_HEADING_RE.test(line.trim()));
              if (start === -1) {
                return '';
              }

              let end = lines.length;
              for (let idx = start + 1; idx < lines.length; idx += 1) {
                if (H2_RE.test(lines[idx].trim())) {
                  end = idx;
                  break;
                }
              }

              return lines
                .slice(start + 1, end)
                .join('\n')
                .trim();
            }

            async function listManagedComments() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });

              return comments.filter((comment) =>
                typeof comment.body === 'string' && comment.body.includes(MARKER),
              );
            }

            async function upsertWarningComment() {
              const managed = await listManagedComments();
              if (managed.length > 0) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: managed[0].id,
                  body: WARNING_BODY,
                });

                for (const extra of managed.slice(1)) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: extra.id,
                  });
                }

                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: WARNING_BODY,
              });
            }

            async function clearWarningComments() {
              const managed = await listManagedComments();
              for (const comment of managed) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
            }

            if (isDraft) {
              core.info('Draft PR detected; skipping enforcement and clearing any existing warning comments.');
              await clearWarningComments();
              return;
            }

            const section = extractPatchNotesSection(prBody);
            const hasPatchNotes = section.length > 0;

            if (!hasPatchNotes) {
              await upsertWarningComment();
              core.setFailed('Missing non-empty `## Patch Notes` section in PR description.');
              return;
            }

            core.info('`## Patch Notes` section found and non-empty. Clearing any stale warning comments.');
            await clearWarningComments();
