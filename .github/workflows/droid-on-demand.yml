name: Economy V2 Codemod Runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.pull_request &&
      github.event.issue.number == 450 &&
      contains(github.event.comment.body, '@economy-v2-codemod')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Economy V2 PR branch
        uses: actions/checkout@v5
        with:
          ref: factory/task-economy-v2-direct-boosts
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic Economy V2 codemods
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-economy-v2-codemod.py
          python3 scripts/apply-economy-v2-schema-codemod.py
          sed -i 's/"  \/\/ Daily Boosts methods")/"  \/\/ AMM \/ LP methods")/' scripts/apply-economy-v2-dependency-codemod.py
          python3 scripts/apply-economy-v2-dependency-codemod.py
          python3 scripts/apply-economy-v2-storage-finalize.py
          python3 scripts/apply-economy-v2-storage-codemod.py
          python3 scripts/apply-economy-v2-storage-interface-fix.py
          python3 scripts/apply-economy-v2-bot-codemod.py
          python3 scripts/apply-economy-v2-surface-codemod.py
          python3 scripts/finalize-economy-v2-compile-cleanup.py
          python3 scripts/apply-economy-v2-discord-api-codemod.py
          python3 scripts/remove-economy-v2-residue.py
          python3 scripts/repair-economy-v2-residue-tests.py

      - name: Format changed source files
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR | grep -E '\.(ts|tsx|js|mjs|json|md)$' || true)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi

      - name: Commit codemod result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sportfolio Automation"
          git config user.email "34044957+michaelhmiv@users.noreply.github.com"
          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "Codemod produced no repository changes."
            exit 1
          fi
          git add -A
          git commit -m "refactor: remove retired Economy V1 residue"
          git fetch origin factory/task-economy-v2-direct-boosts
          git rebase origin/factory/task-economy-v2-direct-boosts
          git push origin HEAD:factory/task-economy-v2-direct-boosts
