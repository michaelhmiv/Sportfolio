name: Finalization Format

on:
  push:
    branches:
      - finalization/2026-08-07
    paths:
      - .github/workflows/finalization-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalization/2026-08-07
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier . --write
      - name: Commit formatting
        run: |
          git config user.name "sportfolio-finalization[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize finalization branch formatting"
          git push origin HEAD:finalization/2026-08-07
