name: Format operational truth cleanup

on:
  push:
    branches:
      - cleanup/operational-truth

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/operational-truth
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format files reported by PR validation
        run: >-
          npx prettier
          DATABASE.md
          docs/auth/railway-environments.md
          server/auth/plugin-oauth-config.ts
          server/mcp/providers/mlb/native-provider.ts
          server/mcp/providers/mlb/provider.ts
          tests/e2e/analytics.spec.ts
          tests/e2e/marketplace-mobile.spec.ts
          tests/e2e/mlb-game-card.spec.ts
          --write
      - name: Remove one-shot workflow
        run: git rm .github/workflows/format-operational-truth.yml
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DATABASE.md docs/auth/railway-environments.md server/auth/plugin-oauth-config.ts server/mcp/providers/mlb/native-provider.ts server/mcp/providers/mlb/provider.ts tests/e2e/analytics.spec.ts tests/e2e/marketplace-mobile.spec.ts tests/e2e/mlb-game-card.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format operational cleanup files'
          git push origin HEAD:cleanup/operational-truth
