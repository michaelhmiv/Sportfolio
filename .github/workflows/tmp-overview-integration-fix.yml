name: Temporary overview integration fix
on:
  push:
    branches:
      - feat/chatgpt-ui-dashboard-collections-rankings
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[overview-integration-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_ENV: test
      DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_plugin_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-ui-dashboard-collections-rankings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch dependency injection and test typing
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('server/mcp/public-tool-registry.ts')
          registry = registry_path.read_text()
          registry = registry.replace(
              '  redeemPremiumShare: typeof redeemPremiumShare;\n',
              '  redeemPremiumShare: typeof redeemPremiumShare;\n  getLeaderboardReadResponse: typeof getLeaderboardReadResponse;\n',
              1,
          )
          registry = registry.replace(
              '  const result = await getLeaderboardReadResponse(category, context.userId);\n',
              '  const result = await context.deps.getLeaderboardReadResponse(category, context.userId);\n',
              1,
          )
          registry = registry.replace(
              '    redeemPremiumShare,\n    listCollections: defaultListCollections,\n',
              '    redeemPremiumShare,\n    getLeaderboardReadResponse,\n    listCollections: defaultListCollections,\n',
              1,
          )
          registry_path.write_text(registry)

          testing_path = Path('server/mcp/testing.ts')
          testing = testing_path.read_text()
          marker = '    redeemPremiumShare: async () => ({ success: true }),\n'
          if marker in testing and 'getLeaderboardReadResponse: async' not in testing:
              testing = testing.replace(
                  marker,
                  marker + '''    getLeaderboardReadResponse: async (category: any, currentUserId?: string | null) => ({\n      category,\n      categoryLabel: "Net Worth",\n      description: "Total virtual account value.",\n      unit: "currency",\n      updatedAt: MOCK_NOW,\n      totalEntries: 1,\n      leaderboard: [\n        {\n          rank: 1,\n          userId: MOCK_USER_ID,\n          username: state.user.username,\n          profileImageUrl: null,\n          value: 12500,\n          rankChange: 0,\n        },\n      ],\n      currentUser:\n        currentUserId === MOCK_USER_ID\n          ? {\n              rank: 1,\n              userId: MOCK_USER_ID,\n              username: state.user.username,\n              profileImageUrl: null,\n              value: 12500,\n              rankChange: 0,\n            }\n          : null,\n      currentUserWindow: [],\n    }),\n''',
                  1,
              )
          elif 'getLeaderboardReadResponse: async' not in testing:
              # Insert before listCollections dependency when fixture layout differs.
              testing = testing.replace(
                  '    listCollections: async () => state.collections,\n',
                  '''    getLeaderboardReadResponse: async (category: any, currentUserId?: string | null) => ({\n      category,\n      categoryLabel: "Net Worth",\n      description: "Total virtual account value.",\n      unit: "currency",\n      updatedAt: MOCK_NOW,\n      totalEntries: 1,\n      leaderboard: [{ rank: 1, userId: MOCK_USER_ID, username: state.user.username, profileImageUrl: null, value: 12500, rankChange: 0 }],\n      currentUser: currentUserId === MOCK_USER_ID ? { rank: 1, userId: MOCK_USER_ID, username: state.user.username, profileImageUrl: null, value: 12500, rankChange: 0 } : null,\n      currentUserWindow: [],\n    }),\n    listCollections: async () => state.collections,\n''',
                  1,
              )
          testing_path.write_text(testing)

          test_path = Path('server/mcp/plugin/ui/overview-surface.test.ts')
          test = test_path.read_text().replace(
              '(args) as any;',
              '(args || {}) as any;',
              1,
          )
          test_path.write_text(test)
          PY
      - name: Format changed files
        run: npx prettier --write server/mcp/public-tool-registry.ts server/mcp/testing.ts server/mcp/plugin/ui/overview-surface.test.ts
      - name: Validate integration contracts
        run: |
          npx tsc -p tsconfig.plugin.json --noEmit
          npm run mcp:audit
          npm run mcp:smoke
          npx vitest run server/mcp/plugin/ui/overview-surface.test.ts
          npm run plugin:ui:audit
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mcp/public-tool-registry.ts server/mcp/testing.ts server/mcp/plugin/ui/overview-surface.test.ts
          if git diff --cached --quiet; then
            echo "No fixes required"
            exit 0
          fi
          git commit -m "Fix overview MCP integration contracts [overview-integration-fix]"
          git push origin HEAD:feat/chatgpt-ui-dashboard-collections-rankings
