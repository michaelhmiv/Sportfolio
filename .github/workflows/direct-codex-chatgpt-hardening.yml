name: One-shot ChatGPT UI hardening

on:
  push:
    branches:
      - factory/task-chatgpt-ui-contract-hardening
    paths:
      - .github/workflows/direct-codex-chatgpt-hardening.yml

permissions:
  contents: write

concurrency:
  group: direct-codex-chatgpt-ui-hardening
  cancel-in-progress: false

env:
  NODE_ENV: test
  DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_codex_ci

jobs:
  implement-test-commit:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out task branch
        uses: actions/checkout@v5
        with:
          ref: factory/task-chatgpt-ui-contract-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Implement task with Codex CLI
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEX_API_KEY"
          codex --version
          codex exec \
            --sandbox workspace-write \
            --ephemeral \
            --ignore-user-config \
            --disable plugins \
            - < .factory/tasks/chatgpt-ui-contract-hardening.md

      - name: Guard implementation scope
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^\.github/workflows/' | grep -v '^\.github/workflows/direct-codex-chatgpt-hardening.yml$'; then
            echo "Implementation modified trusted workflow files outside the one-shot runner." >&2
            exit 1
          fi
          if [ -z "$(git status --porcelain -- server client scripts package.json package-lock.json tsconfig.plugin.json vite.config.ts)" ]; then
            echo "Codex produced no implementation changes in allowed source/test paths." >&2
            exit 1
          fi

      - name: Plugin TypeScript certification
        run: npx tsc -p tsconfig.plugin.json --noEmit

      - name: Repository typecheck
        run: npx tsc

      - name: Production build
        run: npm run build

      - name: Public capability governance
        run: npm run governance:capabilities

      - name: Plugin UI audit
        run: npm run plugin:ui:audit

      - name: MCP audit
        run: npm run mcp:audit

      - name: MCP smoke
        run: npm run mcp:smoke

      - name: Plugin smoke
        run: npx tsx scripts/plugin-smoke.ts

      - name: Focused plugin and UI tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find server/mcp/plugin server/mcp -type f \
            \( -name '*shared-resource*.test.ts' -o -name '*surface*.test.ts' -o -name '*privacy*.test.ts' -o -name '*observability*.test.ts' -o -name '*protocol*.test.ts' \) \
            | sort -u)
          if [ "${#TESTS[@]}" -gt 0 ]; then
            npx vitest run "${TESTS[@]}"
          fi

      - name: Remove one-shot scaffolding and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .factory/tasks/chatgpt-ui-contract-hardening.md
          rm -f .factory-implementation-report.md
          rm -f .github/workflows/direct-codex-chatgpt-hardening.yml
          rmdir .factory/tasks 2>/dev/null || true
          rmdir .factory 2>/dev/null || true

          if [ -z "$(git status --porcelain)" ]; then
            echo "No repository changes remain to commit." >&2
            exit 1
          fi

          git config user.name "openai-codex[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(plugin-ui): harden ChatGPT MCP app contracts"
          git push origin HEAD:factory/task-chatgpt-ui-contract-hardening
