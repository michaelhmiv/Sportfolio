name: Temporary PR 423 Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/chatgpt-ui-market-action-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target files
        run: npx prettier server/mcp/plugin/ui/action-surface.ts server/mcp/plugin/ui/catalog.ts server/mcp/plugin/server.ts client/src/plugin-ui/action-review-panel.tsx client/src/plugin-ui/sportfolio-action-widget.tsx client/src/plugin-ui/sportfolio-widget-entry.ts scripts/plugin-ui-audit.ts plugins/sportfolio/skills/sportfolio-companion/SKILL.md --write
      - name: Commit formatted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mcp/plugin/ui/action-surface.ts server/mcp/plugin/ui/catalog.ts server/mcp/plugin/server.ts client/src/plugin-ui/action-review-panel.tsx client/src/plugin-ui/sportfolio-action-widget.tsx client/src/plugin-ui/sportfolio-widget-entry.ts scripts/plugin-ui-audit.ts plugins/sportfolio/skills/sportfolio-companion/SKILL.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format ChatGPT action review sources"
          git push origin HEAD:${{ github.head_ref }}
