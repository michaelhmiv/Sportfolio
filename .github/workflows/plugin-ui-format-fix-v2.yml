name: Plugin UI Repair Formatter V2

on:
  push:
    branches: [fix/plugin-ui-runtime-rendering-20260811]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/plugin-ui-runtime-rendering-20260811
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write .factory/tasks/economy-v2-direct-boosts.md client/src/pages/portfolio.tsx client/src/plugin-ui/sportfolio-widget-entry.ts docs/plugin/ui-architecture.md scripts/audit-economy-v2-retired-stack.mjs scripts/calibrate-economy-v2.ts scripts/plugin-ui-audit.ts scripts/simulate-economy-v2.ts server/economy/config.ts server/economy/repository.ts server/jobs/settle-boosts.ts
      - run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "Sportfolio Automation"
          git config user.email "34044957+michaelhmiv@users.noreply.github.com"
          git add -A
          git commit -m "chore: format UI repair branch"
          git push origin HEAD:fix/plugin-ui-runtime-rendering-20260811
