name: One-shot Production Dependency Fix

on:
  push:
    branches:
      - plugin/14-release-candidate
    paths:
      - .github/workflows/one-shot-production-dependency-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plugin/14-release-candidate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix

      - name: Require zero critical production advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Install locked dependency tree
        run: npm ci

      - name: Plugin TypeScript certification
        run: npx tsc -p tsconfig.plugin.json --noEmit

      - name: Production build
        run: npm run build

      - name: Plugin unit tests
        run: >-
          npx vitest run
          server/mcp/plugin/capability-policy.test.ts
          server/mcp/plugin/adapters.test.ts
          server/mcp/plugin/runtime-guard.test.ts
          server/auth/plugin-token-verifier.test.ts
          scripts/plugin-oauth-discovery-check.test.ts
          scripts/plugin-oauth-token-inspect.test.ts

      - name: Existing and marketplace MCP certification
        env:
          NODE_ENV: test
          DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sportfolio_plugin_ci
        run: |
          npm run mcp:audit
          npm run mcp:smoke
          npx tsx scripts/plugin-smoke.ts

      - name: Commit verified package updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No safe dependency changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply verified production dependency updates"
          git push origin HEAD:plugin/14-release-candidate
