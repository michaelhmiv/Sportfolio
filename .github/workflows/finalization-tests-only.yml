name: Finalization Tests Only

on:
  push:
    branches:
      - finalization/2026-08-07
    paths:
      - .github/workflows/finalization-tests-only.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finalization/2026-08-07
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run test:run -- --reporter=default > /tmp/vitest-output.txt 2>&1
          status=$?
          {
            echo "<!-- finalization-test-diagnostic -->"
            echo "### Finalization test diagnostic"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Exit status: $status"
            echo
            echo '```text'
            grep -E -B 4 -A 18 'FAIL |Failed Tests|AssertionError|expected .* received|Error:|Test Files|Tests ' /tmp/vitest-output.txt | tail -n 220 || tail -n 220 /tmp/vitest-output.txt
            echo '```'
          } > /tmp/summary.md
          cat /tmp/summary.md
          jq -Rs '{body: .}' < /tmp/summary.md > /tmp/comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/411/comments" \
            --data-binary @/tmp/comment.json
          exit "$status"
