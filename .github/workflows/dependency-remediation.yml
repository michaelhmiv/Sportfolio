name: Dependency and Runtime Security Remediation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, master]
    paths:
      - ".github/workflows/dependency-remediation.yml"
      - "scripts/security-remediation.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation-security-public-repo-hardening
  cancel-in-progress: true

jobs:
  remediate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/public-repo-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v5
        with:
          ref: security/public-repo-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Apply fail-closed runtime hardening
        run: python scripts/security-remediation.py

      - name: Upgrade vulnerable production dependencies
        run: >-
          npm install --save
          @modelcontextprotocol/sdk@^1.30.0
          @opentelemetry/auto-instrumentations-node@^0.79.0
          @opentelemetry/exporter-trace-otlp-http@^0.221.0
          @opentelemetry/sdk-node@^0.221.0
          @sentry/node@^10.62.0
          @sentry/react@^10.67.0
          drizzle-orm@^0.45.2
          firebase-admin@^14.2.0

      - name: Install secure compatible test and build tooling
        run: >-
          npm install --save-dev --save-exact
          vitest@3.2.7
          @vitest/coverage-v8@3.2.7
          vite@7.3.6
          @types/node@20.19.0

      - name: Apply compatible transitive security updates
        run: npm audit fix || true

      - name: Block high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Block high or critical vulnerabilities in the full dependency graph
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Run security-critical regression tests
        run: >-
          npx vitest run
          server/supabaseAuth.test.ts
          server/cors.test.ts
          server/hermes-sidecar.test.ts
          server/auth/plugin-token-verifier.test.ts
          server/api-token-auth.test.ts
          server/mcp/plugin/runtime-guard.test.ts
          server/mcp/mcp-server.test.ts

      - name: Run full test suite diagnostic
        run: npm run test:run
        continue-on-error: true

      - name: Commit validated dependency and runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/supabaseAuth.ts server/index.ts .env.example
          if git diff --cached --quiet; then
            echo "No validated dependency or runtime changes to commit."
            exit 0
          fi
          git commit -m "security: remediate dependencies and fail closed"
          git push origin HEAD:security/public-repo-hardening
