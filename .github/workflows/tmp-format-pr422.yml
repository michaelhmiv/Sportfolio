name: Temporary PR 422 Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/chatgpt-ui-presentation-framework'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target files
        run: npx prettier client/src/plugin-ui/sportfolio-sports-widget.tsx scripts/plugin-ui-audit.ts server/mcp/plugin/ui/catalog.ts server/mcp/plugin/ui/sports-surface.ts --write
      - name: Commit formatted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/plugin-ui/sportfolio-sports-widget.tsx scripts/plugin-ui-audit.ts server/mcp/plugin/ui/catalog.ts server/mcp/plugin/ui/sports-surface.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format ChatGPT sports UI sources"
          git push origin HEAD:${{ github.head_ref }}
