name: Pin MCP v2 dependencies

on:
  push:
    branches:
      - perf/pin-mcp-v2-deps

permissions:
  contents: write

jobs:
  pin:
    if: "!contains(github.event.head_commit.message, 'build: pin MCP v2 runtime dependencies')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/pin-mcp-v2-deps
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin MCP v2 runtime dependencies
        run: npm install --save-exact @modelcontextprotocol/server@2.0.0 @modelcontextprotocol/node@2.0.0-beta.5
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/mcp-v2-pin-artifact.yml
          git commit -m "build: pin MCP v2 runtime dependencies"
          git push origin HEAD:perf/pin-mcp-v2-deps
