name: Unit failure diagnostic

on:
  push:
    branches:
      - cleanup/operational-truth

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit suite and capture output
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:run -- --reporter=verbose > unit-test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 500 unit-test-output.txt > unit-test-tail.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostic
          path: |
            unit-test-output.txt
            unit-test-tail.txt
          retention-days: 1
      - name: Preserve failing status
        if: steps.tests.outputs.status != '0'
        run: exit 1
