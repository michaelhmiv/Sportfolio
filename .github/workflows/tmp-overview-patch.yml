name: Temporary overview patch
on:
  push:
    branches:
      - feat/chatgpt-ui-dashboard-collections-rankings
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[overview-patch]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-ui-dashboard-collections-rankings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch shared contracts and route
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          registry_path = Path('server/mcp/public-tool-registry.ts')
          registry = registry_path.read_text()
          if 'getLeaderboardReadResponse' not in registry:
              marker = 'import { loadUserEntitlements } from "../services/user-entitlements";\n'
              registry = registry.replace(marker, marker + 'import { getLeaderboardReadResponse } from "../leaderboards-read-service";\n')

          schema_marker = '''const collectionDetailSchema: RawSchema = {\n  type: z.string().min(1),\n  targetId: z.string().min(1),\n};\n'''
          leaderboard_schema = '''const leaderboardSchema: RawSchema = {\n  category: z\n    .enum(["netWorth", "cashBalance", "portfolioValue", "tradingVolume24h", "marketOrders"])\n    .optional(),\n  limit: z.number().int().min(3).max(50).optional(),\n};\n'''
          if 'const leaderboardSchema:' not in registry:
              registry = registry.replace(schema_marker, schema_marker + leaderboard_schema)

          list_marker = 'async function listCollections(context: PublicMcpServerContext) {\n'
          leaderboard_fn = '''async function getLeaderboard(\n  context: PublicMcpServerContext,\n  args: Record<string, unknown>,\n) {\n  const category = toStringValue(args.category) || "netWorth";\n  const limit = Math.min(50, Math.max(3, toPositiveInteger(args.limit) || 10));\n  const result = await getLeaderboardReadResponse(category, context.userId);\n  return {\n    summary: `Loaded ${result.categoryLabel} rankings.`,\n    ...result,\n    leaderboard: result.leaderboard.slice(0, limit),\n  };\n}\n\n'''
          if 'async function getLeaderboard(' not in registry:
              registry = registry.replace(list_marker, leaderboard_fn + list_marker)

          tool_marker = '''  defineTool({\n    name: "list_collections",\n'''
          leaderboard_tool = '''  defineTool({\n    name: "get_leaderboard",\n    description:\n      "Load the live Sportfolio trader leaderboard using the same ranking metrics as the website.",\n    domain: "rankings",\n    readOnly: true,\n    inputSchema: leaderboardSchema,\n    fixtureArgs: { category: "netWorth", limit: 10 },\n    routeRefs: ["GET /api/leaderboards"],\n    execute: getLeaderboard,\n  }),\n'''
          if 'name: "get_leaderboard"' not in registry:
              registry = registry.replace(tool_marker, leaderboard_tool + tool_marker)
          registry_path.write_text(registry)

          routes_path = Path('server/routes.ts')
          routes = routes_path.read_text()
          leaderboard_import = '''import {\n  buildLeaderboardWindow,\n  getLeaderboardMeta,\n  getLeaderboardRankChange,\n  normalizeLeaderboardCategory,\n  type LeaderboardCategory,\n  type LeaderboardEntry,\n} from "./leaderboards";\n'''
          if leaderboard_import in routes:
              routes = routes.replace(leaderboard_import, 'import { getLeaderboardReadResponse } from "./leaderboards-read-service";\n')

          pattern = re.compile(r'''  // =====================\n  // Global leaderboards \(public\) - cached and enriched with current-user context when available\n  app\.get\("/api/leaderboards", optionalAuth, async \(req, res\) => \{.*?\n  \}\);\n\n  // Blog posts - public listing \(published posts only\)''', re.S)
          replacement = '''  // =====================\n  // Global leaderboards (public) - cached and enriched with current-user context when available\n  app.get("/api/leaderboards", optionalAuth, async (req, res) => {\n    try {\n      const category = typeof req.query.category === "string" ? req.query.category : null;\n      const currentUserId =\n        typeof (req as any).user?.claims?.sub === "string" ? (req as any).user.claims.sub : null;\n      const payload = await getLeaderboardReadResponse(category, currentUserId);\n\n      if (!currentUserId) {\n        return res.json(\n          withPublicDataHeaders(res, payload, {\n            maxAgeSeconds: 60,\n            sharedMaxAgeSeconds: 60,\n          }),\n        );\n      }\n\n      res.json(payload);\n    } catch (error: any) {\n      if (error?.code === "invalid_category") {\n        return res.status(400).json({ error: "Invalid category" });\n      }\n      console.error("[leaderboards] Error:", error);\n      res.status(500).json({ error: error.message });\n    }\n  });\n\n  // Blog posts - public listing (published posts only)'''
          routes, count = pattern.subn(replacement, routes, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one leaderboard route, replaced {count}')
          routes_path.write_text(routes)

          widget_path = Path('client/src/plugin-ui/sportfolio-overview-widget.tsx')
          widget = widget_path.read_text()
          if 'Sportfolio overview widget root was not found.' not in widget:
              widget += '''\nconst root = document.getElementById("root");\nif (!root) throw new Error("Sportfolio overview widget root was not found.");\nmountOverviewWidget(root);\n'''
          widget_path.write_text(widget)
          PY
      - name: Format touched files
        run: npx prettier --write server/leaderboards-read-service.ts server/routes.ts server/mcp/public-tool-registry.ts server/mcp/plugin/server.ts server/mcp/plugin/ui/catalog.ts server/mcp/plugin/ui/overview-surface.ts client/src/plugin-ui/sportfolio-widget-entry.ts client/src/plugin-ui/sportfolio-overview-widget.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/leaderboards-read-service.ts server/routes.ts server/mcp/public-tool-registry.ts server/mcp/plugin/server.ts server/mcp/plugin/ui/catalog.ts server/mcp/plugin/ui/overview-surface.ts client/src/plugin-ui/sportfolio-widget-entry.ts client/src/plugin-ui/sportfolio-overview-widget.tsx
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "Wire overview data contracts [overview-patch]"
          git push origin HEAD:feat/chatgpt-ui-dashboard-collections-rankings
